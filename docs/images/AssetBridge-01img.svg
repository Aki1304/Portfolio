<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">AssetBridge 에셋 제출 및 Unity 승인 흐름</title>
  <desc id="desc">아트 작업 폴더의 변경 파일을 AssetBridge가 감지하여 Google Drive에 제출하고, Unity Editor에서 미리보기와 승인 후 Assets 폴더에 반영하는 과정</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="500" fill="#f8fafc"/>

  <text x="60" y="52" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="22" font-weight="700" fill="#0f172a">아트 작업자</text>
  <text x="500" y="52" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="22" font-weight="700" fill="#0f172a">공유 저장소</text>
  <text x="820" y="52" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="22" font-weight="700" fill="#0f172a">Unity 작업자</text>

  <line x1="430" y1="28" x2="430" y2="458" stroke="#e2e8f0" stroke-width="2"/>
  <line x1="770" y1="28" x2="770" y2="458" stroke="#e2e8f0" stroke-width="2"/>

  <g filter="url(#shadow)">
    <rect x="60" y="100" width="300" height="110" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="210" y="140" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#0f172a">아트 작업 폴더</text>
    <text x="210" y="172" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" fill="#475569">PNG · JPG · 폴더 분류</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="60" y="285" width="300" height="140" rx="16" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="210" y="325" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#1e3a8a">AssetBridge 앱</text>
    <text x="210" y="358" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16" fill="#1e40af">SHA-256 변경 감지</text>
    <text x="210" y="385" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16" fill="#1e40af">상대 경로 유지 · 선택 제출</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="485" y="190" width="230" height="150" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="600" y="232" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#0f172a">Google Drive</text>
    <text x="600" y="270" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16" fill="#475569">최신 원본 한 벌</text>
    <text x="600" y="300" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16" fill="#475569">커밋 메시지 · 변경 목록</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="830" y="100" width="310" height="160" rx="16" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="985" y="142" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#14532d">Unity 받은 제출함</text>
    <text x="985" y="179" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16" fill="#166534">제출 기록 조회</text>
    <text x="985" y="207" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16" fill="#166534">미리보기 · 파일 선택 승인</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="830" y="320" width="310" height="105" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="985" y="360" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#0f172a">Unity Assets</text>
    <text x="985" y="394" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16" fill="#475569">승인 파일만 기존 분류대로 반영</text>
  </g>

  <path d="M 210 210 L 210 275" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="230" y="250" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" fill="#64748b">스캔</text>

  <path d="M 360 355 C 430 355, 430 265, 475 265" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="410" y="378" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" fill="#64748b">제출</text>

  <path d="M 715 265 C 780 265, 780 180, 820 180" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="766" y="302" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" fill="#64748b">조회</text>

  <path d="M 985 260 L 985 310" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1004" y="293" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" fill="#64748b">승인</text>

  <rect x="442" y="390" width="316" height="58" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/>
  <text x="600" y="416" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15" font-weight="700" fill="#9a3412">자동 동기화 대신 검토 단계를 유지</text>
  <text x="600" y="438" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" fill="#9a3412">프로젝트 반영은 Unity 작업자의 승인 이후 실행</text>
</svg>
